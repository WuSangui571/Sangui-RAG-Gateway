spring:
  application:
    name: sangui-rag-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

rag:
  gateway:
    secret-key: ${RAG_GATEWAY_SECRET_KEY:}
    upstream:
      timeout-seconds: 30
    streaming:
      emitter-timeout-seconds: 300
    embedding:
      timeout-seconds: 30
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      local-path: ${FILE_STORAGE_LOCAL_PATH:./data/uploads}
      object:
        endpoint: ${FILE_STORAGE_OBJECT_ENDPOINT:}
        bucket: ${FILE_STORAGE_OBJECT_BUCKET:}
        access-key: ${FILE_STORAGE_OBJECT_ACCESS_KEY:}
        secret-key: ${FILE_STORAGE_OBJECT_SECRET_KEY:}
        region: ${FILE_STORAGE_OBJECT_REGION:us-east-1}
        path-style-access: ${FILE_STORAGE_OBJECT_PATH_STYLE_ACCESS:true}
    document:
      chunk-size: ${RAG_DOCUMENT_CHUNK_SIZE:800}
      chunk-overlap: ${RAG_DOCUMENT_CHUNK_OVERLAP:100}
      max-file-size-bytes: ${RAG_DOCUMENT_MAX_FILE_SIZE_BYTES:1048576}
    retrieval:
      default-top-k: ${RAG_RETRIEVAL_DEFAULT_TOP_K:5}
      default-similarity-threshold: ${RAG_RETRIEVAL_DEFAULT_SIMILARITY_THRESHOLD:0.700}
      default-max-context-chunks: ${RAG_RETRIEVAL_DEFAULT_MAX_CONTEXT_CHUNKS:5}
      default-max-context-chars: ${RAG_RETRIEVAL_DEFAULT_MAX_CONTEXT_CHARS:12000}
      default-max-single-chunk-chars: ${RAG_RETRIEVAL_DEFAULT_MAX_SINGLE_CHUNK_CHARS:3000}
    api-key-limits:
      enabled: ${RAG_API_KEY_LIMITS_ENABLED:true}
      default-requests-per-minute: ${RAG_API_KEY_LIMITS_DEFAULT_REQUESTS_PER_MINUTE:60}
      default-tokens-per-minute: ${RAG_API_KEY_LIMITS_DEFAULT_TOKENS_PER_MINUTE:60000}
      default-daily-request-quota: ${RAG_API_KEY_LIMITS_DEFAULT_DAILY_REQUEST_QUOTA:1000}
      default-daily-token-quota: ${RAG_API_KEY_LIMITS_DEFAULT_DAILY_TOKEN_QUOTA:1000000}
      default-completion-token-reservation: ${RAG_API_KEY_LIMITS_DEFAULT_COMPLETION_TOKEN_RESERVATION:1024}
  admin-auth:
    jwt-expiration-seconds: ${RAG_ADMIN_AUTH_JWT_EXPIRATION_SECONDS:86400}
  production-guard:
    allow-local-file-storage: ${RAG_PRODUCTION_ALLOW_LOCAL_FILE_STORAGE:false}
    allow-output-capture: ${RAG_PRODUCTION_ALLOW_OUTPUT_CAPTURE:false}
  document-processing:
    worker:
      enabled: true
      poll-fixed-delay-ms: 5000
      stale-processing-timeout-ms: 900000
      max-attempts: 3
      retry-backoff-ms: 60000
      worker-id: ${HOSTNAME:local}
  request-log:
    output-capture:
      enabled: false
      preview-max-chars: 1000
      retention-days: 7
      cleanup-enabled: true
      cleanup-fixed-delay-ms: 3600000
      reason-max-chars: 256
