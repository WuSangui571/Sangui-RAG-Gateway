spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sangui_rag_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:sangui}
    password: ${SPRING_DATASOURCE_PASSWORD:sangui_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sangui.raggateway: DEBUG

rag:
  admin-auth:
    jwt-secret: ${RAG_ADMIN_AUTH_JWT_SECRET:local-dev-admin-jwt-secret-change-me-32chars}
  gateway:
    encryption:
      secret-key: ${RAG_GATEWAY_ENCRYPTION_SECRET_KEY:local-dev-aes-key-secret-change-me-32chars}
