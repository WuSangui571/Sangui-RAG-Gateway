name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sangui_rag_gateway
          POSTGRES_USER: sangui
          POSTGRES_PASSWORD: sangui_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sangui -d sangui_rag_gateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile backend
        run: mvn -q -DskipTests compile
        working-directory: backend
      - name: Run backend tests
        run: mvn test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sangui_rag_gateway
          SPRING_DATASOURCE_USERNAME: sangui
          SPRING_DATASOURCE_PASSWORD: sangui_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          RAG_GATEWAY_SECRET_KEY: local-dev-change-me
          FILE_STORAGE_LOCAL_PATH: ./data/uploads

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker-backend:
    name: Docker build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t sangui-rag-gateway-backend:ci -f backend/Dockerfile backend

  docker-frontend:
    name: Docker build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t sangui-rag-gateway-frontend:ci -f frontend/Dockerfile frontend
