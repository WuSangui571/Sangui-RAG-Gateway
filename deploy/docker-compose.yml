services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sangui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sangui_rag_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-sangui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sangui_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sangui} -d ${POSTGRES_DB:-sangui_rag_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sangui-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sangui-backend
    ports:
      - "${BACKEND_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sangui_rag_gateway}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sangui}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sangui_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RAG_ADMIN_AUTH_JWT_SECRET: ${RAG_ADMIN_AUTH_JWT_SECRET:-}
      RAG_GATEWAY_ENCRYPTION_SECRET_KEY: ${RAG_GATEWAY_ENCRYPTION_SECRET_KEY:-}
      RAG_GATEWAY_SECRET_KEY: ${RAG_GATEWAY_SECRET_KEY:-}
      RAG_ADMIN_AUTH_DEFAULT_ADMIN_USERNAME: ${RAG_ADMIN_AUTH_DEFAULT_ADMIN_USERNAME:-admin}
      RAG_ADMIN_AUTH_DEFAULT_ADMIN_PASSWORD: ${RAG_ADMIN_AUTH_DEFAULT_ADMIN_PASSWORD:-admin123}
      RAG_ADMIN_AUTH_ALLOW_DEFAULT_ADMIN: ${RAG_ADMIN_AUTH_ALLOW_DEFAULT_ADMIN:-false}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      FILE_STORAGE_LOCAL_PATH: /app/data/uploads
      FILE_STORAGE_OBJECT_ENDPOINT: ${FILE_STORAGE_OBJECT_ENDPOINT:-}
      FILE_STORAGE_OBJECT_BUCKET: ${FILE_STORAGE_OBJECT_BUCKET:-}
      FILE_STORAGE_OBJECT_ACCESS_KEY: ${FILE_STORAGE_OBJECT_ACCESS_KEY:-}
      FILE_STORAGE_OBJECT_SECRET_KEY: ${FILE_STORAGE_OBJECT_SECRET_KEY:-}
      FILE_STORAGE_OBJECT_REGION: ${FILE_STORAGE_OBJECT_REGION:-us-east-1}
      FILE_STORAGE_OBJECT_PATH_STYLE_ACCESS: ${FILE_STORAGE_OBJECT_PATH_STYLE_ACCESS:-true}
      RAG_DOCUMENT_CHUNK_SIZE: ${RAG_DOCUMENT_CHUNK_SIZE:-800}
      RAG_DOCUMENT_CHUNK_OVERLAP: ${RAG_DOCUMENT_CHUNK_OVERLAP:-100}
      RAG_DOCUMENT_MAX_FILE_SIZE_BYTES: ${RAG_DOCUMENT_MAX_FILE_SIZE_BYTES:-1048576}
      RAG_GATEWAY_EMBEDDING_BATCH_SIZE: ${RAG_GATEWAY_EMBEDDING_BATCH_SIZE:-64}
      RAG_RETRIEVAL_DEFAULT_TOP_K: ${RAG_RETRIEVAL_DEFAULT_TOP_K:-5}
      RAG_RETRIEVAL_DEFAULT_SIMILARITY_THRESHOLD: ${RAG_RETRIEVAL_DEFAULT_SIMILARITY_THRESHOLD:-0.300}
      RAG_RETRIEVAL_DEFAULT_MAX_CONTEXT_CHUNKS: ${RAG_RETRIEVAL_DEFAULT_MAX_CONTEXT_CHUNKS:-5}
      RAG_RETRIEVAL_DEFAULT_MAX_CONTEXT_CHARS: ${RAG_RETRIEVAL_DEFAULT_MAX_CONTEXT_CHARS:-12000}
      RAG_RETRIEVAL_DEFAULT_MAX_SINGLE_CHUNK_CHARS: ${RAG_RETRIEVAL_DEFAULT_MAX_SINGLE_CHUNK_CHARS:-3000}
      RAG_PRODUCTION_ALLOW_LOCAL_FILE_STORAGE: ${RAG_PRODUCTION_ALLOW_LOCAL_FILE_STORAGE:-false}
      RAG_PRODUCTION_ALLOW_OUTPUT_CAPTURE: ${RAG_PRODUCTION_ALLOW_OUTPUT_CAPTURE:-false}
      RAG_PRODUCTION_ALLOW_WEAK_LOCAL_SECRET: ${RAG_PRODUCTION_ALLOW_WEAK_LOCAL_SECRET:-false}
      RAG_API_KEY_LIMITS_ENABLED: ${RAG_API_KEY_LIMITS_ENABLED:-true}
      RAG_API_KEY_LIMITS_DEFAULT_REQUESTS_PER_MINUTE: ${RAG_API_KEY_LIMITS_DEFAULT_REQUESTS_PER_MINUTE:-60}
      RAG_API_KEY_LIMITS_DEFAULT_TOKENS_PER_MINUTE: ${RAG_API_KEY_LIMITS_DEFAULT_TOKENS_PER_MINUTE:-60000}
      RAG_API_KEY_LIMITS_DEFAULT_DAILY_REQUEST_QUOTA: ${RAG_API_KEY_LIMITS_DEFAULT_DAILY_REQUEST_QUOTA:-1000}
      RAG_API_KEY_LIMITS_DEFAULT_DAILY_TOKEN_QUOTA: ${RAG_API_KEY_LIMITS_DEFAULT_DAILY_TOKEN_QUOTA:-1000000}
      RAG_API_KEY_LIMITS_DEFAULT_COMPLETION_TOKEN_RESERVATION: ${RAG_API_KEY_LIMITS_DEFAULT_COMPLETION_TOKEN_RESERVATION:-1024}
    volumes:
      - backend-data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SERVER_PORT:-8080}/api/health | grep -q '\"code\":\"OK\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sangui-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_UPSTREAM: http://backend:${SERVER_PORT:-8080}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  backend-data:
