services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sangui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sangui_rag_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-sangui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sangui_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sangui} -d ${POSTGRES_DB:-sangui_rag_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sangui-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres-data:
  redis-data:
